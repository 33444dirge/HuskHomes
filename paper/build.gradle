plugins {
    id 'xyz.jpenilla.run-paper' version '2.3.1'
}

dependencies {
    implementation 'net.kyori:adventure-text-minimessage:4.26.1'
    implementation 'net.william278:desertwell:2.0.7'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.fatboyindustrial.gson-javatime-serialisers:gson-javatime-serialisers:1.1.2'
    implementation 'de.exlll:configlib-yaml:4.8.1'
    implementation('com.zaxxer:HikariCP:7.0.2') { exclude module: 'slf4j-api' }

    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'
    implementation 'net.william278.toilet:toilet-bukkit:1.1.0'

    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'com.google.guava:guava:33.5.0-jre'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'me.clip:placeholderapi:2.12.2'
    compileOnly('net.essentialsx:EssentialsX:2.21.1') { exclude group: 'org.spigotmc', module: 'spigot-api' }
    compileOnly 'com.github.plan-player-analytics:Plan:5.6.2883'
    compileOnly 'com.github.BlueMap-Minecraft:BlueMapAPI:2.6.0'
    compileOnly 'us.dynmap:DynmapCoreAPI:3.4'
    compileOnly 'maven.modrinth:pl3xmap:1.20.4-489'
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'org.projectlombok:lombok:1.18.42'

    compileOnly "redis.clients:jedis:${jedis_version}"
    compileOnly "org.xerial:sqlite-jdbc:${sqlite_driver_version}"
    compileOnly "com.mysql:mysql-connector-j:${mysql_driver_version}"
    compileOnly "org.mariadb.jdbc:mariadb-java-client:${mariadb_driver_version}"
    compileOnly "com.h2database:h2:${h2_driver_version}"
    compileOnly "org.postgresql:postgresql:${postgresql_driver_version}"

    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
compileJava.options.release.set(21)

shadowJar {
    dependencies {
        exclude(dependency('com.mojang:brigadier'))

        // Paper provides Adventure API + MiniMessage natively; do not bundle them.
        // (adventure-platform-* is NOT provided by Paper, so it stays bundled.)
        exclude(dependency('net.kyori:adventure-api'))
        exclude(dependency('net.kyori:adventure-key'))
        exclude(dependency('net.kyori:adventure-nbt'))
        exclude(dependency('net.kyori:adventure-text-minimessage'))
        exclude(dependency('net.kyori:adventure-text-serializer-gson'))
        exclude(dependency('net.kyori:adventure-text-serializer-gson-legacy-impl'))
        exclude(dependency('net.kyori:adventure-text-serializer-json'))
        exclude(dependency('net.kyori:adventure-text-serializer-json-legacy-impl'))
        exclude(dependency('net.kyori:adventure-text-serializer-legacy'))
        exclude(dependency('net.kyori:adventure-text-serializer-commons'))
        exclude(dependency('net.kyori:adventure-text-serializer-bungeecord'))
        exclude(dependency('net.kyori:examination-api'))
        exclude(dependency('net.kyori:examination-string'))
        exclude(dependency('net.kyori:option'))
    }

    relocate 'org.apache.commons.io', 'net.william278.huskhomes.libraries.commons.io'
    relocate 'org.apache.commons.text', 'net.william278.huskhomes.libraries.commons.text'
    relocate 'org.apache.commons.lang3', 'net.william278.huskhomes.libraries.commons.lang3'
    relocate 'org.jetbrains', 'net.william278.huskhomes.libraries'
    relocate 'org.intellij', 'net.william278.huskhomes.libraries'
    relocate 'com.zaxxer', 'net.william278.huskhomes.libraries'
    relocate 'net.william278.desertwell', 'net.william278.huskhomes.libraries.desertwell'
    relocate 'net.william278.toilet', 'net.william278.huskhomes.libraries.toilet'
    relocate 'de.exlll', 'net.william278.huskhomes.libraries'
    relocate 'org.json', 'net.william278.huskhomes.libraries.json'
    relocate 'org.yaml.snakeyaml', 'net.william278.huskhomes.libraries.snakeyaml'
    relocate 'com.google.gson', 'net.william278.huskhomes.libraries.gson'
    relocate 'org.bstats', 'net.william278.huskhomes.libraries.bstats'
    relocate 'net.kyori.adventure.text.minimessage', 'net.william278.huskhomes.libraries.adventure.text.minimessage'

    minimize()
}

tasks {
    runServer {
        minecraftVersion('1.21.4')

        downloadPlugins {
            url("https://download.luckperms.net/1571/bukkit/loader/LuckPerms-Bukkit-5.4.154.jar")
            github("MilkBowl", "Vault", "1.7.3", "Vault.jar")
            github("YiC200333", "XConomy", "2.26.3", "XConomy-Paper-2.26.3.jar")
        }
    }
}
